<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1d2021" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="rgba(168,153,132,0.2)" stroke-width="2" />
  
  <!-- Target / Crosshair -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#fabd2f" stroke-width="2.5" stroke-opacity="0.9" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#fabd2f" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6" />
  
  <!-- Candlesticks inside -->
  <!-- Bullish Candle (Green) -->
  <line x1="24" y1="18" x2="24" y2="44" stroke="#8ec07c" stroke-width="2" />
  <rect x="20.5" y="24" width="7" height="14" rx="1.5" fill="#8ec07c" />

  <!-- Bearish Candle (Red) -->
  <line x1="40" y1="20" x2="40" y2="46" stroke="#fb4934" stroke-width="2" />
  <rect x="36.5" y="22" width="7" height="16" rx="1.5" fill="#fb4934" />

  <!-- Center Target Dot -->
  <circle cx="32" cy="32" r="3" fill="#fabd2f" />
</svg>